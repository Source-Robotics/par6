    - icon: fontawesome/brands/discord
      link: https://discord.gg/prjUvjmGpZ
    - icon: fontawesome/brands/patreon
      link: https://www.patreon.com/PCrnjak
  # The version selector in the header (built by mike: one entry per deployed runtime minor + "latest").
  version:
    provider: mike
    default: latest
    alias: true
  # The language selector in the header. One language today; a translation adds an entry and a build.
  alternate:
    - name: English
      link: ./
      lang: en
  # The header's repository card per section (overrides/partials/source.html): page-URL prefix -> repository.
  # A longer prefix listed later overrides a shorter one listed earlier.
  repos:
    - prefix: par6/
      name: Source-Robotics/PAR6-Collaborative-Robot-Arm
      url: https://github.com/Source-Robotics/PAR6-Collaborative-Robot-Arm
    - prefix: rcb/
      name: Source-Robotics/RCB-Runtime
      url: https://github.com/Source-Robotics/RCB-Runtime
    - prefix: rcb/01-introduction/
      name: Source-Robotics/RCB-Robot-Control-Box
      url: https://github.com/Source-Robotics/RCB-Robot-Control-Box
    - prefix: rcb/02-safety/
      name: Source-Robotics/RCB-Robot-Control-Box
      url: https://github.com/Source-Robotics/RCB-Robot-Control-Box
    - prefix: rcb/03-technical-specifications/
      name: Source-Robotics/RCB-Robot-Control-Box
      url: https://github.com/Source-Robotics/RCB-Robot-Control-Box
    - prefix: rcb/04-installing/
      name: Source-Robotics/RCB-Robot-Control-Box
      url: https://github.com/Source-Robotics/RCB-Robot-Control-Box
    - prefix: rcb/07-operating/firmware
      name: Source-Robotics/STEPFOC-stepper-controller
      url: https://github.com/Source-Robotics/STEPFOC-stepper-controller
    - prefix: rcb/developer/motor-driver-firmware/
      name: Source-Robotics/STEPFOC-stepper-controller
      url: https://github.com/Source-Robotics/STEPFOC-stepper-controller
    - prefix: programming/
      name: Source-Robotics/RCB-Runtime
      url: https://github.com/Source-Robotics/RCB-Runtime
    - prefix: rti/
      name: Source-Robotics/RCB-Runtime
      url: https://github.com/Source-Robotics/RCB-Runtime
    - prefix: dashboard/
      name: Source-Robotics/RCB-Runtime
      url: https://github.com/Source-Robotics/RCB-Runtime
    - prefix: grippers/msg/
      name: Source-Robotics/MSG-compliant-AI-stepper-gripper
      url: https://github.com/Source-Robotics/MSG-compliant-AI-stepper-gripper
    - prefix: grippers/ssg48/
      name: Source-Robotics/SSG-48-adaptive-electric-gripper
      url: https://github.com/Source-Robotics/SSG-48-adaptive-electric-gripper
    - prefix: grippers/pneumatic/
      name: Source-Robotics/PAR6-Collaborative-Robot-Arm
      url: https://github.com/Source-Robotics/PAR6-Collaborative-Robot-Arm
    - prefix: simulation/
      name: Source-Robotics/PAR6-Collaborative-Robot-Arm
      url: https://github.com/Source-Robotics/PAR6-Collaborative-Robot-Arm
  # DEVELOPMENT ONLY: the floating colour switcher (overrides/main.html). Build with DEV_PALETTE=1 to show it.
  dev_palette: !ENV [DEV_PALETTE, false]
  # Page status markers (front matter `status: ...`) shown as an icon in the sidebar.
  status:
    new: Recently added
    deprecated: Deprecated
    draft: Not written yet

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js   # sortable tables (click a header)
  - javascripts/tablesort.js

exclude_docs: |
  includes/

# The site root only redirects to the PAR6 Hardware Manual; it is not a page of the nav.
