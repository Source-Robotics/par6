site_name: Source Robotics Docs
site_description: Documentation for the PAR6 robot arm, the Robot Control Box, its software and end effectors.
# Where the site is published: the organisation's docs domain, this repository's path. Search engines take each page's
# address from here, and the sitemap is built from it.
site_url: https://docs.source-robotics.com/par6/
# The docs repository: the header card on unmapped pages, and the "edit this page" target.
repo_url: https://github.com/Source-Robotics/par6
repo_name: Source-Robotics/par6
edit_uri: edit/main/docs/
copyright: |
  &copy; 2026 <a href="https://source-robotics.com" target="_blank" rel="noopener">Source Robotics d.o.o.</a> ·
  Text and images <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a> ·
  Code examples <a href="https://github.com/Source-Robotics/par6/blob/main/LICENSE-CODE" target="_blank" rel="noopener">MIT</a>

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo_new_2.png
  favicon: assets/Icon2.png
  language: en
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  features:
    - navigation.tabs          # one tab per document
    - navigation.tabs.sticky
    - navigation.sections      # the bold sidebar groups
    - navigation.indexes       # a chapter is a folder with its own page
    - navigation.footer        # Previous / Next
    - navigation.top
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.view
    - content.action.edit
    - content.tooltips          # title="..." on links and abbreviations become tooltips
    - content.footnote.tooltips
    - announce.dismiss          # the announcement bar (overrides/main.html) can be closed
  palette:
    - scheme: slate            # dark by default
      primary: black
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

plugins:
  - search
  - tags                      # `tags:` in a page's front matter (shown under the title)
  - glightbox                 # click any image to zoom (figures in manuals)
  - social:
      enabled: !ENV [ENABLE_SOCIAL, false]   # social cards only in CI (needs cairo + pillow)

# The version facts of versions.yml written into the pages: every manual's version box and the list of documents.
hooks:
  - hooks/versions.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - abbr
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path:
        - docs/includes
      check_paths: true
      auto_append:
        - abbreviations.md    # site-wide abbreviations -> tooltips on every page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols

extra:
  social:
