# Publishes the documentation on every push to main (versioning step V6, 2026-10-22).
#
# It publishes the version named by docs_version in versions.yml (the runtime's MAJOR.MINOR) and points "latest"
# at it, with mike, into the gh-pages branch. Older versions stay as they were. In the repository's Settings > Pages,
# the source must be "Deploy from a branch", branch gh-pages, folder / (root).
#
# A strict build runs first: a broken link or a missing page publishes nothing.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      - name: Publish this version with mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
          VERSION=$(python -c "import yaml; print(yaml.safe_load(open('versions.yml'))['docs_version'])")
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest
