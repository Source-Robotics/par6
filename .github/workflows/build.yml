# Build check: every push and pull request must build the site with no warning (broken links, missing pages).
# It publishes nothing. Publishing the versioned site (mike, to the gh-pages branch) is set up separately — a plain
# `mkdocs gh-deploy` would overwrite the versions mike keeps there.
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/test_tools.py          # the version hook and the sync tool
      - run: mkdocs build --strict
